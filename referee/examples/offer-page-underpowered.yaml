# The design document's section 6 example, as written there.
#
# It is deliberately flawed: its 14 days deliver 58,800 units but the effect it targets
# needs 389,060, and it says nothing about how the test will be run. Referee reports
# DES-001 and PRO-001 as blockers, so the recommendation is "revise" (exit status 1).
#
# Try it:  python -m referee review-design examples/offer-page-underpowered.yaml
referee_spec_version: 1
id: hybrid_offer_page_2026_10
title: Subscription offer page variants
owner: analytics

hypothesis:
  # "null" is quoted on purpose: an unquoted null: is read by YAML as an empty key, and
  # Referee refuses it.
  "null": The offer page variant does not change 7-day subscription conversion.
  alternative: Variant B increases 7-day subscription conversion.
  direction: increase

population:
  randomization_unit: player
  analysis_unit: player
  eligibility: Players who open the offer page and are not subscribed at exposure.
  daily_eligible_units: 4200
  exposure_trigger: offer_page_view

arms:
  - {name: control, allocation: 0.5, is_control: true}
  - {name: variant_b, allocation: 0.5}

primary_metric:
  name: subscription_conversion_7d
  kind: binary
  baseline: 0.032
  baseline_std: null
  governed_reference: docs/metrics/hybrid_subscription.md # relative to analytics-lab/

guardrails:
  - name: refund_rate_14d
    kind: binary
    baseline: 0.018
    harmful_direction: increase
    tolerance_relative: 0.10

design:
  mde_relative: 0.05
  alpha: 0.05
  power: 0.80
  sided: two_sided
  planned_duration_days: 14
  min_duration_days: 14
