name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Jobs run in the lab's folder, analytics-lab/, unless they override this (the referee
# job does). `uses` steps and actions/checkout still operate on the repository root.
defaults:
  run:
    working-directory: analytics-lab

jobs:
  shared-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-lab/pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run shared checks
        run: bash scripts/validation/run_shared_checks.sh

  scenario-quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [live_strategy, subscription, hybrid_subscription]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-lab/pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run ${{ matrix.scenario }} checks
        run: bash scripts/validation/run_${{ matrix.scenario }}_checks.sh

  referee-quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: referee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: referee/pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q
