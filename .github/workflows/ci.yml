name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run shared checks
        run: bash scripts/validation/run_shared_checks.sh

  scenario-quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [live_strategy, subscription, hybrid_subscription]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run ${{ matrix.scenario }} checks
        run: bash scripts/validation/run_${{ matrix.scenario }}_checks.sh
