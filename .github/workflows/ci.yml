name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# The lab lives in analytics-lab/. Every `run` step starts there; `uses` steps and
# actions/checkout still operate on the repository root.
defaults:
  run:
    working-directory: analytics-lab

jobs:
  shared-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-lab/pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run shared checks
        run: bash scripts/validation/run_shared_checks.sh

  scenario-quality-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [live_strategy, subscription, hybrid_subscription]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-lab/pyproject.toml
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run ${{ matrix.scenario }} checks
        run: bash scripts/validation/run_${{ matrix.scenario }}_checks.sh
