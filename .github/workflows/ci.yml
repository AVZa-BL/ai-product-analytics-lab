name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run shared checks
        run: bash scripts/validation/run_shared_checks.sh

  hybrid-subscription-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run hybrid subscription checks
        run: bash scripts/validation/run_hybrid_subscription_checks.sh
