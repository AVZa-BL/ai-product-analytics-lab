[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
]

[project.optional-dependencies]
dev = [
  "dbt-core==1.12.3",
  "dbt-duckdb==1.11.0",
  "pytest>=8.3,<9",
  "jupyterlab>=4.3,<5",
  "jupytext>=1.17,<2",
  "nbconvert>=7.16,<8",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
