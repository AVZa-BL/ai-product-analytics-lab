# The same funnel, fixed. `linesman review-plan` recommends PROCEED. Copy this one.
linesman_plan_version: 1
id: checkout_funnel
title: Checkout funnel
owner: growth-analytics                # default owner for every event
identity_keys: [user_id, anonymous_id]

events:
  - name: checkout_started
    description: Player opens the checkout screen.
    trigger: Checkout screen is shown.
    properties:
      - {name: user_id, type: string, required: true, description: Signed-in player id.}
      - {name: cart_value, type: number, description: Cart total in euro cents.}
      - {name: plan_id, type: string, description: Plan in the cart.}

  - name: order_completed
    description: Payment is confirmed by the payment provider.
    trigger: Provider webhook reports success.
    properties:
      - {name: user_id, type: string, required: true}
      - {name: cart_value, type: number, description: Cart total in euro cents.}
      - {name: payment_method, type: enum, allowed_values: [card, wallet, invoice]}
      - {name: billing_email, type: string, pii: true, description: Receipt address.}

  - name: refund_requested
    description: Player requests a refund.
    trigger: Refund form is submitted.
    properties:
      - {name: anonymous_id, type: string, required: true}

metrics:
  - name: checkout_conversion
    events: [checkout_started, order_completed]
  - name: refund_rate
    events: [order_completed, refund_requested]
