[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracewright"
version = "0.1.0"
description = "Proposes and reviews product tracking: events, properties and types for a new feature"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
# `propose` calls a model through the official SDK; `review-plan` and `import-plan` do not need it.
llm = ["anthropic>=1.12,<2"]
dev = [
  "anthropic>=1.12,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
