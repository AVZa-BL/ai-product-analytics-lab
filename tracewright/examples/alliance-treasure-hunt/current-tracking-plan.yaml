# The existing tracking of the synthetic game "Realm of Ember". Synthetic, like everything here.
tracewright_plan_version: 1
id: realm_of_ember_core
title: Realm of Ember core tracking
owner: live-ops-analytics
identity_keys: [player_id]

events:
  - name: session_started
    description: A play session begins.
    trigger: The app comes to the foreground after at least 30 minutes away, or is cold started.
    properties:
      - {name: player_id, type: string, required: true, description: Opaque player id.}
      - {name: platform, type: enum, allowed_values: [ios, android], description: Device platform.}
      - {name: app_version, type: string, description: Installed app version.}

  - name: quest_completed
    description: A player completes a quest.
    trigger: The quest reward screen is shown.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: quest_id, type: string, required: true, description: Quest identifier.}
      - {name: quest_type, type: enum, allowed_values: [daily, weekly, story]}

  - name: battle_finished
    description: A battle ends.
    trigger: The battle result screen is shown.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: battle_type, type: enum, allowed_values: [pve, pvp, alliance_war]}
      - {name: result, type: enum, allowed_values: [win, loss, draw]}
      - {name: duration_seconds, type: integer, description: Battle length in seconds.}

  - name: alliance_joined
    description: A player joins an alliance.
    trigger: The server confirms the membership.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: alliance_id, type: string, required: true, description: Opaque alliance id.}
      - {name: alliance_size, type: integer, description: Members after the join.}

  - name: alliance_left
    # No description or trigger: a pre-existing gap (DOC-001) that is not the proposal's fault.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: alliance_id, type: string, required: true}

  - name: currency_spent
    description: A player spends an in-game currency.
    trigger: The server confirms the spend.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: currency, type: enum, allowed_values: [ember_coins, gems]}
      - {name: amount, type: integer, required: true, description: Whole units spent.}
      - {name: sink, type: string, required: true, description: Where the currency went.}

  - name: purchase_completed
    description: A real-money purchase succeeds.
    trigger: The store confirms the purchase.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: product_id, type: string, required: true, description: Store product id.}
      - {name: price_minor, type: integer, required: true, description: Price in minor units.}
      - {name: currency_code, type: string, required: true, description: ISO 4217 code.}

  - name: push_opened
    description: A player opens the app from a push notification.
    trigger: The app is opened through a notification.
    properties:
      - {name: player_id, type: string, required: true}
      - {name: campaign_id, type: string, required: true, description: Push campaign id.}

metrics:
  - {name: d7_retention, events: [session_started]}
  - {name: quest_completion, events: [quest_completed]}
  - {name: battle_participation, events: [battle_finished]}
  - {name: alliance_activity, events: [alliance_joined, alliance_left]}
  - {name: economy_sinks, events: [currency_spent]}
  - {name: revenue, events: [purchase_completed]}
  - {name: push_engagement, events: [push_opened]}
