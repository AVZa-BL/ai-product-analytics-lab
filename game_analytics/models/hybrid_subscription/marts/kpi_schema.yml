version: 2

models:
  - name: mart_hybrid_subscription__daily_kpis
    description: Daily descriptive KPIs by prior-payer and eventual-subscriber status; not a causal estimate.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: daily_kpi_id
        data_tests: [not_null, unique]
      - name: metric_date
        data_tests: [not_null]
      - name: prior_payer_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prior_payer, prior_nonpayer]

  - name: mart_hybrid_subscription__matched_incrementality
    description: >-
      One row per deterministic subscriber-control pair. Publishes explicit pre and
      post values, within-player changes, and subscriber-minus-control
      difference-in-differences for 28-day sessions, LiveOps participation, and
      standalone, subscription, and total net revenue. Matching is observational
      and does not by itself establish a causal effect.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: pair_id
        description: Stable subscriber-control pair identifier and model grain.
        data_tests: [not_null, unique]
      - name: subscriber_player_id
        data_tests: [not_null, unique]
      - name: control_player_id
        data_tests: [not_null, unique]
      - name: subscriber_prior_payer_status
        data_tests: [not_null]
      - name: control_prior_payer_status
        data_tests: [not_null]
      - name: subscriber_platform
        data_tests: [not_null]
      - name: control_platform
        data_tests: [not_null]
      - name: subscriber_acquisition_channel
        data_tests: [not_null]
      - name: control_acquisition_channel
        data_tests: [not_null]
      - name: matched_pair_count
        description: Total actual matched pairs, sourced from the one-row population summary.
        data_tests: [not_null]
      - name: session_count_difference_in_differences
        description: Subscriber session change minus matched-control session change.
        data_tests: [not_null]
      - name: liveops_participation_count_difference_in_differences
        description: Subscriber LiveOps change minus matched-control LiveOps change.
        data_tests: [not_null]
      - name: standalone_store_net_revenue_usd_difference_in_differences
        description: Subscriber standalone-store revenue change minus matched-control change.
        data_tests: [not_null]
      - name: subscription_net_revenue_usd_difference_in_differences
        description: Subscriber subscription revenue change minus matched-control change.
        data_tests: [not_null]
      - name: total_net_revenue_usd_difference_in_differences
        description: Subscriber total cash-revenue change minus matched-control change.
        data_tests: [not_null]

  - name: mart_hybrid_subscription__engagement_lift_inputs
    description: >-
      Matched-pair session and LiveOps change summaries by the exact matching
      covariates. Component sums and matched-pair denominators support safe
      reaggregation; published means remain observational diagnostics.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: engagement_segment_id
        description: One row per exact-match prior-payer status, platform, and acquisition-channel stratum.
        data_tests: [not_null, unique]
      - name: matched_pair_count
        description: Number of actual pairs in this exact-match stratum; denominator for all means.
        data_tests: [not_null]
      - name: matched_subscriber_count
        data_tests: [not_null]
      - name: matched_control_count
        data_tests: [not_null]
      - name: subscriber_session_count_change_sum
        description: Sum of subscriber 28-day post-minus-pre session_count changes across matched pairs in this row; numerator for mean_subscriber_session_count_change.
        data_tests: [not_null]
      - name: control_session_count_change_sum
        description: Sum of control 28-day post-minus-pre session_count changes across matched pairs in this row; numerator for mean_control_session_count_change.
        data_tests: [not_null]
      - name: session_count_difference_in_differences_sum
        description: Sum of subscriber post-minus-pre changes minus control post-minus-pre changes in session_count; numerator for mean_session_count_difference_in_differences.
        data_tests: [not_null]
      - name: subscriber_liveops_participation_count_change_sum
        description: Sum of subscriber 28-day post-minus-pre liveops_participation_count changes across matched pairs in this row; numerator for mean_subscriber_liveops_participation_count_change.
        data_tests: [not_null]
      - name: control_liveops_participation_count_change_sum
        description: Sum of control 28-day post-minus-pre liveops_participation_count changes across matched pairs in this row; numerator for mean_control_liveops_participation_count_change.
        data_tests: [not_null]
      - name: liveops_participation_count_difference_in_differences_sum
        description: Sum of subscriber post-minus-pre changes minus control post-minus-pre changes in liveops_participation_count; numerator for mean_liveops_participation_count_difference_in_differences.
        data_tests: [not_null]
      - name: mean_subscriber_session_count_change
        description: subscriber_session_count_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_control_session_count_change
        description: control_session_count_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_session_count_difference_in_differences
        description: session_count_difference_in_differences_sum divided by matched_pair_count; mean subscriber-minus-control change per matched pair.
        data_tests: [not_null]
      - name: mean_subscriber_liveops_participation_count_change
        description: subscriber_liveops_participation_count_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_control_liveops_participation_count_change
        description: control_liveops_participation_count_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_liveops_participation_count_difference_in_differences
        description: liveops_participation_count_difference_in_differences_sum divided by matched_pair_count; mean subscriber-minus-control change per matched pair.
        data_tests: [not_null]

  - name: mart_hybrid_subscription__cannibalization_inputs
    description: >-
      Matched prior-payer pair summaries for standalone-store displacement,
      subscription revenue, and total cash value. Component sums and the
      matched-pair denominator make every published mean recomputable.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: cannibalization_segment_id
        description: One row for the prior_payer stratum, only when pairs with both arms prior payers exist.
        data_tests: [not_null, unique]
      - name: prior_payer_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [prior_payer]
      - name: matched_pair_count
        description: Number of pairs with both arms prior payers; denominator for all means.
        data_tests: [not_null]
      - name: matched_subscriber_count
        data_tests: [not_null]
      - name: matched_control_count
        data_tests: [not_null]
      - name: subscriber_standalone_store_net_revenue_usd_change_sum
        description: Sum of subscriber 28-day post-minus-pre standalone_store_net_revenue_usd changes across matched pairs in this row; numerator for mean_subscriber_standalone_store_net_revenue_usd_change.
        data_tests: [not_null]
      - name: control_standalone_store_net_revenue_usd_change_sum
        description: Sum of control 28-day post-minus-pre standalone_store_net_revenue_usd changes across matched pairs in this row; numerator for mean_control_standalone_store_net_revenue_usd_change.
        data_tests: [not_null]
      - name: standalone_store_net_revenue_usd_difference_in_differences_sum
        description: Sum of subscriber post-minus-pre changes minus control post-minus-pre changes in standalone_store_net_revenue_usd; numerator for mean_standalone_store_net_revenue_usd_difference_in_differences.
        data_tests: [not_null]
      - name: subscriber_subscription_net_revenue_usd_change_sum
        description: Sum of subscriber 28-day post-minus-pre subscription_net_revenue_usd changes across matched pairs in this row; numerator for mean_subscriber_subscription_net_revenue_usd_change.
        data_tests: [not_null]
      - name: control_subscription_net_revenue_usd_change_sum
        description: Sum of control 28-day post-minus-pre subscription_net_revenue_usd changes across matched pairs in this row; numerator for mean_control_subscription_net_revenue_usd_change.
        data_tests: [not_null]
      - name: subscription_net_revenue_usd_difference_in_differences_sum
        description: Sum of subscriber post-minus-pre changes minus control post-minus-pre changes in subscription_net_revenue_usd; numerator for mean_subscription_net_revenue_usd_difference_in_differences.
        data_tests: [not_null]
      - name: subscriber_total_net_revenue_usd_change_sum
        description: Sum of subscriber 28-day post-minus-pre total_net_revenue_usd changes across matched pairs in this row; numerator for mean_subscriber_total_net_revenue_usd_change.
        data_tests: [not_null]
      - name: control_total_net_revenue_usd_change_sum
        description: Sum of control 28-day post-minus-pre total_net_revenue_usd changes across matched pairs in this row; numerator for mean_control_total_net_revenue_usd_change.
        data_tests: [not_null]
      - name: total_net_revenue_usd_difference_in_differences_sum
        description: Sum of subscriber post-minus-pre changes minus control post-minus-pre changes in total_net_revenue_usd; numerator for mean_total_net_revenue_usd_difference_in_differences.
        data_tests: [not_null]
      - name: mean_subscriber_standalone_store_net_revenue_usd_change
        description: subscriber_standalone_store_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_control_standalone_store_net_revenue_usd_change
        description: control_standalone_store_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_standalone_store_net_revenue_usd_difference_in_differences
        description: standalone_store_net_revenue_usd_difference_in_differences_sum divided by matched_pair_count; mean subscriber-minus-control change per matched pair.
        data_tests: [not_null]
      - name: mean_subscriber_subscription_net_revenue_usd_change
        description: subscriber_subscription_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_control_subscription_net_revenue_usd_change
        description: control_subscription_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_subscription_net_revenue_usd_difference_in_differences
        description: subscription_net_revenue_usd_difference_in_differences_sum divided by matched_pair_count; mean subscriber-minus-control change per matched pair.
        data_tests: [not_null]
      - name: mean_subscriber_total_net_revenue_usd_change
        description: subscriber_total_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_control_total_net_revenue_usd_change
        description: control_total_net_revenue_usd_change_sum divided by matched_pair_count; mean 28-day post-minus-pre change per matched pair.
        data_tests: [not_null]
      - name: mean_total_net_revenue_usd_difference_in_differences
        description: total_net_revenue_usd_difference_in_differences_sum divided by matched_pair_count; mean subscriber-minus-control change per matched pair.
        data_tests: [not_null]
