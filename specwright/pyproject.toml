[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "specwright"
version = "0.1.0"
description = "Drafts an experiment spec from a brief or a design document; Referee checks it"
requires-python = ">=3.12,<3.13"
# Referee and Tracewright are siblings in this repository and are installed from their folders
# first: python -m pip install -e ../referee -e ../tracewright -e .
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
# `draft` calls a model through the official SDK; `draft --replay` does not need it.
llm = ["anthropic>=1.12,<2"]
dev = [
  "anthropic>=1.12,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
