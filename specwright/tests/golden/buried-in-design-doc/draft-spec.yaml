# A draft. Every value is the model's reading of the documents: check each one
# against report.md, and confirm the values it lists as inferred, before registering this.
referee_spec_version: 1
id: skyharbor_pass_price
title: Season Pass price test
owner: live-ops
hypothesis:
  'null': Lowering the Season Pass price to 7.99 USD does not change the share of players who buy it within
    14 days of first seeing the pass screen.
  alternative: The lower price raises the pass purchase rate.
  direction: increase
population:
  randomization_unit: player
  analysis_unit: player
  eligibility: Existing players who see the pass screen.
  exposure_trigger: first sight of the pass screen
  exposure_timing: pre_treatment
  interference: none_expected
  kind: existing_users
  daily_eligible_units: 6000
primary_metric:
  name: season_pass_purchase_14d
  kind: binary
  baseline: 0.065
design:
  mde_relative: 0.08
  alpha: 0.05
  power: 0.8
  sided: two_sided
  planned_duration_days: 28
  min_duration_days: 21
procedure:
  stopping_rule: fixed_horizon
  srm_check_cadence: daily
arms:
- name: control
  allocation: 0.5
  is_control: true
- name: variant_a
  allocation: 0.5
  is_control: false
guardrails:
- name: active_days_14d
  kind: continuous
  baseline: 6.4
  baseline_std: 3.9
  harmful_direction: decrease
  tolerance_relative: 0.03
