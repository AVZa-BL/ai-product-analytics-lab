version: 2

models:
  - name: stg_subscription__users
    description: One canonical row per synthetic subscription user.
    config:
      tags: [subscription]
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: signup_at
        data_tests: [not_null]

  - name: stg_subscription__subscription_events
    description: One canonical lifecycle event per webhook identifier.
    config:
      tags: [subscription]
    columns:
      - name: webhook_id
        data_tests: [not_null, unique]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - trial_started
                  - trial_ended
                  - paid_started
                  - renewed
                  - cancelled
                  - expired
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id

  - name: stg_subscription__product_events
    description: Product events with explicit activation-name canonicalization.
    config:
      tags: [subscription]
    columns:
      - name: canonical_event_name
        data_tests: [not_null]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id

  - name: stg_subscription__onboarding_events
    description: Typed onboarding events retaining occurrence and ingestion evidence.
    config:
      tags: [subscription]
    columns:
      - name: onboarding_event_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id

  - name: stg_subscription__payments
    description: Typed payment attempts retaining failed and refunded evidence.
    config:
      tags: [subscription]
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id

  - name: stg_subscription__marketing_spend
    description: Typed campaign spend at source-record grain.
    config:
      tags: [subscription]
    columns:
      - name: spend_id
        data_tests: [not_null, unique]

  - name: stg_subscription__support_tickets
    description: Typed support tickets linked to canonical users.
    config:
      tags: [subscription]
    columns:
      - name: ticket_id
        data_tests: [not_null, unique]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id

  - name: int_subscription__activation_events
    description: First canonical activation timestamp for each activated user.
    config:
      tags: [subscription]
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: activation_at
        data_tests: [not_null]

  - name: int_subscription__subscription_periods
    description: Non-overlapping trial and paid entitlement intervals reconstructed by effective time.
    config:
      tags: [subscription]
    columns:
      - name: subscription_id
        data_tests: [not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscription__users')
                field: user_id
      - name: period_start_at
        data_tests: [not_null]
      - name: period_end_at
        data_tests: [not_null]
      - name: lifecycle_status
        data_tests:
          - accepted_values:
              arguments:
                values: [trial, paid]

  - name: int_subscription__trial_cohorts
    description: Trial cohorts with an explicit 21-day maturity cutoff.
    config:
      tags: [subscription]
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: cohort_date
        data_tests: [not_null]
      - name: maturity_cutoff_date
        data_tests: [not_null]

  - name: int_subscription__paid_cohorts
    description: First paid-entitlement cohort for each converted subscription.
    config:
      tags: [subscription]
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: cohort_date
        data_tests: [not_null]

  - name: int_subscription__campaign_attribution
    description: Signup attribution with missing campaigns contained in an explicit unknown bucket.
    config:
      tags: [subscription]
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: campaign_id
        data_tests: [not_null]
      - name: attribution_status
        data_tests:
          - accepted_values:
              arguments:
                values: [attributed, missing_campaign]

  - name: int_subscription__quality_audit
    description: One-row audit of the five deliberately injected data-quality incident categories.
    config:
      tags: [subscription]
    columns:
      - name: duplicate_webhook_rows
        data_tests: [not_null]
      - name: late_cancellation_rows
        data_tests: [not_null]
      - name: missing_campaign_users
        data_tests: [not_null]
      - name: unmapped_activation_events
        data_tests: [not_null]
      - name: local_time_trial_end_rows
        data_tests: [not_null]

  - name: dim_subscription__users
    description: Conformed subscription user dimension with acquisition, trial, paid, and activation milestones.
    config:
      tags: [subscription]
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: signup_date
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]

  - name: dim_subscription__campaigns
    description: Conformed campaign dimension including the explicit unknown campaign.
    config:
      tags: [subscription]
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]

  - name: fct_subscription__daily_user_state
    description: One row per signed-up user and UTC calendar date with governed trial, paid, and activation state.
    config:
      tags: [subscription]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription__users')
                field: user_id
      - name: calendar_date
        data_tests: [not_null]
      - name: monthly_recurring_revenue_usd
        data_tests: [not_null]

  - name: fct_subscription__payments
    description: One row per payment attempt with explicit success, failure, refund, and recognized-revenue fields.
    config:
      tags: [subscription]
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: subscription_id
        data_tests: [not_null]
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription__users')
                field: user_id

  - name: fct_subscription__marketing_spend_daily
    description: Daily marketing spend by campaign and country.
    config:
      tags: [subscription]
    columns:
      - name: spend_date
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription__campaigns')
                field: campaign_id
      - name: country_code
        data_tests: [not_null]

  - name: mart_subscription__kpis_daily
    description: Governed daily subscription KPI mart with maturity, quality, and attribution context.
    config:
      tags: [subscription]
    columns:
      - name: metric_date
        data_tests: [not_null, unique]
      - name: data_quality_status
        data_tests:
          - accepted_values:
              arguments:
                values: [passed, review_required]

  - name: mart_subscription__trial_conversion_diagnostic
    description: Mature trial conversion outcomes segmented by acquisition, plan, and activation state.
    config:
      tags: [subscription]
    columns:
      - name: cohort_date
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscription__campaigns')
                field: campaign_id
      - name: plan_id
        data_tests: [not_null]
      - name: activation_segment
        data_tests:
          - accepted_values:
              arguments:
                values: [activated_before_trial_end, not_activated_before_trial_end]
      - name: maturity_cutoff_date
        data_tests: [not_null]
