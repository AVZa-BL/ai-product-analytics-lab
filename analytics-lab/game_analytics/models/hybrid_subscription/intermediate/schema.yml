version: 2

models:
  - name: int_hybrid_subscription__subscription_entitlements
    description: One reconstructed entitlement interval per synthetic subscriber.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: player_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_hybrid_subscription__players')
                field: player_id
      - name: entitlement_start_at_utc
        data_tests: [not_null]
      - name: entitlement_end_at_utc
        data_tests: [not_null]

  - name: int_hybrid_subscription__grant_reconciliation
    description: Subscription transaction to currency-grant reconciliation with missing links classified.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: grant_link_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [linked, missing_link, no_grant]

  - name: int_hybrid_subscription__marketing_exposure_eligibility
    description: Exposure timing eligibility for matching and incrementality analysis.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: exposure_id
        data_tests: [not_null, unique]
      - name: player_id
        data_tests: [not_null]

  - name: int_hybrid_subscription__analysis_population
    description: All candidate rows with valid-identity, matching-covariate, eligible-exposure and per-source event/ingestion maturity exclusions.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        description: May be null or blank only on an explicitly excluded candidate.
      - name: index_at_utc
        description: First eligible exposure timestamp; null when the player has no eligible exposure.
      - name: eligible_exposure_at_utc
        description: First incrementality-eligible marketing exposure timestamp.
      - name: observation_start_at_utc
        description: Latest of the per-source first event timestamps; sources must all cover the pre-window.
      - name: observation_end_at_utc
        description: Earliest of the per-source last event timestamps; sources must all cover the post-window.
      - name: ingestion_mature_through_at_utc
        description: Minimum across sources of max ingestion time minus maximum observed nonnegative lag; empirical allowance, not an operational completeness SLA.
      - name: are_source_watermarks_valid
        description: All three relevant sources are present and contain only finite non-null event/ingestion timestamps with nonnegative lag.
        data_tests: [not_null]
      - name: exclusion_reason
        description: Mutually exclusive reason the player is excluded from mature pre/post analysis.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - no_eligible_exposure
                  - subscription_not_after_exposure
                  - invalid_player_identity
                  - invalid_matching_covariates
                  - missing_or_invalid_source_watermark
                  - immature_pre_window
                  - immature_post_window
                  - ingestion_watermark_not_mature
      - name: is_population_eligible
        description: True only when exposure ordering and both 28-day observation windows are valid.
        data_tests: [not_null]

  - name: int_hybrid_subscription__player_28d_behavior
    description: Two mature pre/post behavior rows per eligible player with governed engagement, LiveOps, and separated cash categories.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: analysis_period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pre, post]
      - name: index_at_utc
        data_tests: [not_null]
      - name: eligible_exposure_at_utc
        data_tests: [not_null]
      - name: is_population_eligible
        data_tests: [not_null]
      - name: is_window_mature
        data_tests: [not_null]
      - name: reward_track_net_revenue_usd
        data_tests: [not_null]
      - name: standalone_transaction_count
        data_tests: [not_null]
      - name: discounted_standalone_transaction_count
        data_tests: [not_null]

  - name: int_hybrid_subscription__matched_pairs
    description: >-
      Deterministic greedy one-to-one matches without replacement, using mature eligible
      pre-period behavior and exact prior-payer, platform, and acquisition-channel strata.
      Subscribers are visited by stratum, pre-session count, then player ID. Each chooses
      the unused control with minimum absolute pre-session distance, then lower control
      pre-session count, then control player ID. No pair row is emitted for an unmatched
      subscriber; an entirely unmatched population therefore produces an empty relation.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: pair_id
        description: Subscriber player ID joined to control player ID with a double underscore.
        data_tests: [not_null, unique]
      - name: subscriber_sequence
        description: Global subscriber visit order; gaps identify unmatched subscribers.
        data_tests: [not_null, unique]
      - name: subscriber_player_id
        data_tests: [not_null, unique]
      - name: control_player_id
        data_tests: [not_null, unique]
      - name: subscriber_prior_payer_status
        data_tests: [not_null]
      - name: control_prior_payer_status
        data_tests: [not_null]
      - name: subscriber_platform
        data_tests: [not_null]
      - name: control_platform
        data_tests: [not_null]
      - name: subscriber_acquisition_channel
        data_tests: [not_null]
      - name: control_acquisition_channel
        data_tests: [not_null]
      - name: subscriber_pre_session_count
        data_tests: [not_null]
      - name: control_pre_session_count
        data_tests: [not_null]
      - name: pre_session_count_distance
        description: Absolute difference between subscriber and control pre-session counts.
        data_tests: [not_null]
      - name: eligible_subscriber_count
        description: All eligible pre-period subscribers, repeated on each pair.
        data_tests: [not_null]
      - name: eligible_control_count
        description: All eligible pre-period controls, repeated on each pair.
        data_tests: [not_null]
      - name: matched_pair_count
        description: Total matched pairs, repeated on each pair.
        data_tests: [not_null]
      - name: unmatched_subscriber_count
        description: Eligible subscribers minus matched pairs.
        data_tests: [not_null]
      - name: unmatched_control_count
        description: Eligible controls minus matched pairs.
        data_tests: [not_null]

  - name: int_hybrid_subscription__match_population_summary
    description: >-
      Exactly one row of eligible, matched, and unmatched population control totals,
      including empty, single-arm, and disjoint-stratum populations with zero pairs.
      Counts come from eligible pre-period behavior and actual matched pairs, so no
      synthetic pair row is needed. The population reconciliation test enforces the
      one-row grain and independently verifies all five totals.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: eligible_subscriber_count
        description: All mature eligible pre-period subscribers, including unmatched players.
        data_tests: [not_null]
      - name: eligible_control_count
        description: All mature eligible pre-period controls, including unmatched players.
        data_tests: [not_null]
      - name: matched_pair_count
        description: Actual pair row count; zero when no pairs exist.
        data_tests: [not_null]
      - name: unmatched_subscriber_count
        description: Eligible subscribers minus actual matched pairs.
        data_tests: [not_null]
      - name: unmatched_control_count
        description: Eligible controls minus actual matched pairs.
        data_tests: [not_null]

  - name: int_hybrid_subscription__quality_audit
    description: Counts of designed defects preserved through the governed intermediate layer.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: incident_code
        data_tests: [not_null, unique]
      - name: affected_rows
        data_tests: [not_null]

  - name: int_hybrid_subscription__source_watermarks
    description: Three fail-closed per-source completeness proxy rows. Uses only observed event and ingestion timestamps, never a wall-clock or invented telemetry watermark.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: source_name
        data_tests: [not_null, unique]
      - name: source_row_count
        data_tests: [not_null]
      - name: invalid_timestamp_row_count
        data_tests: [not_null]
      - name: post_window_allowance_seconds
        description: Maximum observed nonnegative ingestion lag in elapsed seconds, including latest canonical webhook arrival. Null when no valid observations exist.
      - name: is_source_valid
        data_tests: [not_null]

  - name: int_hybrid_subscription__governed_observation_boundary
    description: One fail-closed observation boundary shared by forward-looking hybrid analyses; as-of is the minimum mature-through timestamp across all three required sources.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: are_source_watermarks_valid
        data_tests: [not_null]
      - name: observation_start_at_utc
      - name: observation_end_at_utc
      - name: as_of_at_utc

  - name: int_hybrid_subscription__experiment_first_exposure
    description: One row per assigned experiment player with first-touch exposure, repeat-exposure count and exposure-versus-first-purchase timing.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        data_tests: [not_null, unique]
      - name: assignment_id
        data_tests: [not_null, unique]
      - name: arm
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, variant_b, variant_c]
      - name: exposure_count
        data_tests: [not_null]
      - name: is_exposed_after_first_purchase
        description: True only when a first purchase exists and the first exposure is later than it; false (not null) when there is no purchase or no exposure.
        data_tests: [not_null]

  - name: int_hybrid_subscription__experiment_eligible_population
    description: All assigned experiment players with segment attributes, a 28-day pre-assignment session count and an eligibility verdict; excluded rows are retained with their reason.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        data_tests: [not_null, unique]
      - name: platform
        data_tests: [not_null]
      - name: pre_sessions_28d
        description: Canonical sessions in the half-open 672-hour window before assignment. Measured to be uncorrelated with the experiment outcomes (r about 0 at 5,000 players), so it is not a useful CUPED covariate in this dataset.
        data_tests: [not_null]
      - name: is_eligible
        data_tests: [not_null]
      - name: exclusion_reason
        description: Null for eligible rows.
        data_tests:
          - accepted_values:
              arguments:
                values: [never_exposed, exposed_after_first_purchase]

  - name: int_hybrid_subscription__experiment_srm
    description: One row per experiment with the chi-square sample-ratio check of assigned players against an equal split. The p-value formula exp(-x/2) is exact only for 2 degrees of freedom, so arm_count is pinned to 3.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: experiment_id
        data_tests: [not_null, unique]
      - name: arm_count
        data_tests:
          - accepted_values:
              arguments:
                values: [3]
      - name: p_value
        data_tests: [not_null]
      - name: is_srm_flagged
        description: True when p is below 0.001, a conventional SRM alarm level that is stricter than the usual 0.05 because the check runs on every experiment.
        data_tests: [not_null]

unit_tests:
  - name: experiment_first_exposure_edge_cases
    description: Paths the generated data never reaches (a player never exposed, an exposure at the same instant as the first purchase, exposure ids out of time order, same-instant exposures listed with the lowest id first and last, an assignment with no outcomes row), and every pass-through column compared.
    model: int_hybrid_subscription__experiment_first_exposure
    config:
      tags: [hybrid_subscription]
    given:
      - input: ref('stg_hybrid_subscription__experiment_assignments')
        rows:
          - {assignment_id: a1, experiment_id: e, player_id: unexposed_buyer, arm: control, assigned_at_utc: '2026-04-11 00:00:00+00', arm_config_version: 1}
          - {assignment_id: a2, experiment_id: e, player_id: exposed_after_buy, arm: variant_b, assigned_at_utc: '2026-04-11 00:30:00+00', arm_config_version: 2}
          - {assignment_id: a3, experiment_id: e, player_id: exposed_before_buy, arm: variant_b, assigned_at_utc: '2026-04-11 00:45:00+00', arm_config_version: 1}
          - {assignment_id: a4, experiment_id: e, player_id: tied_exposures, arm: variant_c, assigned_at_utc: '2026-04-11 00:15:00+00', arm_config_version: 1}
          - {assignment_id: a5, experiment_id: e, player_id: exposed_no_buy, arm: control, assigned_at_utc: '2026-04-11 00:10:00+00', arm_config_version: 1}
          - {assignment_id: a6, experiment_id: e, player_id: exposed_at_purchase, arm: control, assigned_at_utc: '2026-04-11 00:20:00+00', arm_config_version: 1}
          - {assignment_id: a7, experiment_id: e, player_id: no_outcome_row, arm: variant_c, assigned_at_utc: '2026-04-11 00:25:00+00', arm_config_version: 1}
          - {assignment_id: a8, experiment_id: e, player_id: tied_low_id_first, arm: variant_b, assigned_at_utc: '2026-04-11 00:35:00+00', arm_config_version: 1}
      - input: ref('stg_hybrid_subscription__experiment_exposures')
        rows:
          - {exposure_id: x1, player_id: exposed_after_buy, exposed_at_utc: '2026-04-11 03:00:00+00', exposure_surface: banner}
          - {exposure_id: x2, player_id: exposed_after_buy, exposed_at_utc: '2026-04-11 02:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x3, player_id: exposed_before_buy, exposed_at_utc: '2026-04-11 01:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x5, player_id: tied_exposures, exposed_at_utc: '2026-04-11 01:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x4, player_id: tied_exposures, exposed_at_utc: '2026-04-11 01:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x6, player_id: exposed_no_buy, exposed_at_utc: '2026-04-11 01:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x7, player_id: exposed_at_purchase, exposed_at_utc: '2026-04-11 01:00:00+00', exposure_surface: offer_page}
          - {exposure_id: x8, player_id: no_outcome_row, exposed_at_utc: '2026-04-11 01:30:00+00', exposure_surface: offer_page}
          - {exposure_id: y1, player_id: tied_low_id_first, exposed_at_utc: '2026-04-11 01:15:00+00', exposure_surface: offer_page}
          - {exposure_id: y2, player_id: tied_low_id_first, exposed_at_utc: '2026-04-11 01:15:00+00', exposure_surface: banner}
      - input: ref('stg_hybrid_subscription__experiment_outcomes')
        rows:
          - {player_id: unexposed_buyer, first_purchase_at_utc: '2026-04-11 05:00:00+00'}
          - {player_id: exposed_after_buy, first_purchase_at_utc: '2026-04-11 01:00:00+00'}
          - {player_id: exposed_before_buy, first_purchase_at_utc: '2026-04-11 02:00:00+00'}
          - {player_id: tied_exposures, first_purchase_at_utc: null}
          - {player_id: exposed_no_buy, first_purchase_at_utc: null}
          - {player_id: exposed_at_purchase, first_purchase_at_utc: '2026-04-11 01:00:00+00'}
          - {player_id: tied_low_id_first, first_purchase_at_utc: null}
    expect:
      rows:
        - {experiment_id: e, assignment_id: a1, player_id: unexposed_buyer, arm: control, assigned_at_utc: '2026-04-11 00:00:00+00', arm_config_version: 1, is_exposed: false, exposure_count: 0, first_exposure_id: null, first_exposed_at_utc: null, first_exposure_surface: null, first_purchase_at_utc: '2026-04-11 05:00:00+00', is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a2, player_id: exposed_after_buy, arm: variant_b, assigned_at_utc: '2026-04-11 00:30:00+00', arm_config_version: 2, is_exposed: true, exposure_count: 2, first_exposure_id: x2, first_exposed_at_utc: '2026-04-11 02:00:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: '2026-04-11 01:00:00+00', is_exposed_after_first_purchase: true}
        - {experiment_id: e, assignment_id: a3, player_id: exposed_before_buy, arm: variant_b, assigned_at_utc: '2026-04-11 00:45:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 1, first_exposure_id: x3, first_exposed_at_utc: '2026-04-11 01:00:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: '2026-04-11 02:00:00+00', is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a4, player_id: tied_exposures, arm: variant_c, assigned_at_utc: '2026-04-11 00:15:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 2, first_exposure_id: x4, first_exposed_at_utc: '2026-04-11 01:00:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: null, is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a5, player_id: exposed_no_buy, arm: control, assigned_at_utc: '2026-04-11 00:10:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 1, first_exposure_id: x6, first_exposed_at_utc: '2026-04-11 01:00:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: null, is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a6, player_id: exposed_at_purchase, arm: control, assigned_at_utc: '2026-04-11 00:20:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 1, first_exposure_id: x7, first_exposed_at_utc: '2026-04-11 01:00:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: '2026-04-11 01:00:00+00', is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a7, player_id: no_outcome_row, arm: variant_c, assigned_at_utc: '2026-04-11 00:25:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 1, first_exposure_id: x8, first_exposed_at_utc: '2026-04-11 01:30:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: null, is_exposed_after_first_purchase: false}
        - {experiment_id: e, assignment_id: a8, player_id: tied_low_id_first, arm: variant_b, assigned_at_utc: '2026-04-11 00:35:00+00', arm_config_version: 1, is_exposed: true, exposure_count: 2, first_exposure_id: y1, first_exposed_at_utc: '2026-04-11 01:15:00+00', first_exposure_surface: offer_page, first_purchase_at_utc: null, is_exposed_after_first_purchase: false}
  - name: experiment_first_exposure_tie_break
    description: First touch among same-instant exposures is the lowest exposure_id. Twenty-four players each have three exposures at one instant, with the lowest id listed second, so taking the first listed, the last listed or a random row fails.
    model: int_hybrid_subscription__experiment_first_exposure
    config:
      tags: [hybrid_subscription]
    given:
      - input: ref('stg_hybrid_subscription__experiment_assignments')
        format: sql
        rows: |
          select 'e' as experiment_id, 'a_' || player_id as assignment_id, player_id, 'control' as arm,
              timestamptz '2026-04-11 00:00:00+00' as assigned_at_utc, 1 as arm_config_version
          from (select 'p' || lpad(cast(i as varchar), 2, '0') as player_id from range(24) t(i))
      - input: ref('stg_hybrid_subscription__experiment_exposures')
        format: sql
        rows: |
          with players as (select 'p' || lpad(cast(i as varchar), 2, '0') as player_id from range(24) t(i))
          select 'x_' || player_id || '_b' as exposure_id, player_id,
              timestamptz '2026-04-11 01:00:00+00' as exposed_at_utc, 'offer_page' as exposure_surface from players
          union all
          select 'x_' || player_id || '_a', player_id,
              timestamptz '2026-04-11 01:00:00+00', 'offer_page' from players
          union all
          select 'x_' || player_id || '_c', player_id,
              timestamptz '2026-04-11 01:00:00+00', 'offer_page' from players
      - input: ref('stg_hybrid_subscription__experiment_outcomes')
        format: sql
        rows: |
          select 'p' || lpad(cast(i as varchar), 2, '0') as player_id,
              cast(null as timestamptz) as first_purchase_at_utc
          from range(24) t(i)
    expect:
      format: sql
      rows: |
        select 'a_' || player_id as assignment_id, 'e' as experiment_id, player_id, 'control' as arm,
            timestamptz '2026-04-11 00:00:00+00' as assigned_at_utc, 1 as arm_config_version,
            'x_' || player_id || '_a' as first_exposure_id,
            timestamptz '2026-04-11 01:00:00+00' as first_exposed_at_utc,
            'offer_page' as first_exposure_surface, 3 as exposure_count, true as is_exposed,
            cast(null as timestamptz) as first_purchase_at_utc,
            false as is_exposed_after_first_purchase
        from (select 'p' || lpad(cast(i as varchar), 2, '0') as player_id from range(24) t(i))
  - name: experiment_eligible_population_verdicts_and_window
    description: Exclusion reasons, the half-open 672-hour pre-assignment window boundaries, every segment attribute, and an assigned player missing from the players table (kept, not dropped).
    model: int_hybrid_subscription__experiment_eligible_population
    config:
      tags: [hybrid_subscription]
    given:
      - input: ref('int_hybrid_subscription__experiment_first_exposure')
        rows:
          - {assignment_id: a1, experiment_id: e, player_id: clean, arm: control, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 1, is_exposed: true, is_exposed_after_first_purchase: false}
          - {assignment_id: a2, experiment_id: e, player_id: never_exposed, arm: variant_b, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 2, is_exposed: false, is_exposed_after_first_purchase: false}
          - {assignment_id: a3, experiment_id: e, player_id: late_exposed, arm: variant_c, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 1, is_exposed: true, is_exposed_after_first_purchase: true}
          - {assignment_id: a4, experiment_id: e, player_id: no_player_row, arm: control, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 1, is_exposed: true, is_exposed_after_first_purchase: false}
      - input: ref('stg_hybrid_subscription__players')
        rows:
          - {player_id: clean, platform: android, acquisition_channel: organic, prior_payer_status: prior_payer}
          - {player_id: never_exposed, platform: ios, acquisition_channel: paid, prior_payer_status: prior_nonpayer}
          - {player_id: late_exposed, platform: android, acquisition_channel: referral, prior_payer_status: prior_nonpayer}
      - input: ref('stg_hybrid_subscription__sessions')
        rows:
          - {session_id: s_inside_start, player_id: clean, started_at_utc: '2026-04-02 00:00:00+00'}
          - {session_id: s_inside_end, player_id: clean, started_at_utc: '2026-04-29 23:59:59+00'}
          - {session_id: s_too_early, player_id: clean, started_at_utc: '2026-04-01 23:59:59+00'}
          - {session_id: s_at_assignment, player_id: clean, started_at_utc: '2026-04-30 00:00:00+00'}
          - {session_id: s_other_player, player_id: late_exposed, started_at_utc: '2026-04-20 00:00:00+00'}
    expect:
      rows:
        - {experiment_id: e, assignment_id: a1, player_id: clean, arm: control, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 1, platform: android, acquisition_channel: organic, prior_payer_status: prior_payer, pre_sessions_28d: 2, is_eligible: true, exclusion_reason: null}
        - {experiment_id: e, assignment_id: a2, player_id: never_exposed, arm: variant_b, assigned_at_utc: '2026-04-30 00:00:00+00', arm_config_version: 2, platform: ios, acquisition_channel: paid, prior_payer_status: prior_nonpayer, pre_sessions_28d: 0, is_eligible: false, exclusion_reason: never_exposed}
