  - name: experiment_srm_counts_and_threshold
    description: Exact chi-square values and the zero-arm case. The alarm threshold itself is pinned by experiment_srm_alarm_threshold_boundary.
    model: int_hybrid_subscription__experiment_srm
    config:
      tags: [hybrid_subscription]
    given:
      - input: ref('stg_hybrid_subscription__experiment_assignments')
        format: csv
        rows: |
          assignment_id,experiment_id,arm
          even_1,even,control
          even_2,even,variant_b
          even_3,even,variant_c
          skew_1,skew,control
          skew_2,skew,control
          skew_3,skew,control
          skew_4,skew,variant_b
          skew_5,skew,variant_b
          skew_6,skew,variant_c
          empty_arm_1,empty_arm,control
          empty_arm_2,empty_arm,control
          empty_arm_3,empty_arm,control
          empty_arm_4,empty_arm,variant_b
          empty_arm_5,empty_arm,variant_b
          empty_arm_6,empty_arm,variant_b
    expect:
      rows:
        - {experiment_id: even, assigned_players: 3, arm_count: 3, chi_square: 0, is_srm_flagged: false}
        - {experiment_id: skew, assigned_players: 6, arm_count: 3, chi_square: 1, is_srm_flagged: false}
        - {experiment_id: empty_arm, assigned_players: 6, arm_count: 3, chi_square: 3, is_srm_flagged: false}
  - name: experiment_srm_alarm_threshold_boundary
    description: Alarm threshold either side of p = 0.001 (chi-square 13.8155) to within 0.002%, counts 79/86/127 of 292 players (chi-square 13.81507, p 0.0010002, not flagged) and 62/93/51 of 206 players (chi-square 13.81553, p 0.00099999, flagged).
    model: int_hybrid_subscription__experiment_srm
    config:
      tags: [hybrid_subscription]
    given:
      - input: ref('stg_hybrid_subscription__experiment_assignments')
        format: sql
        rows: |
          select 'below_c_' || i as assignment_id, 'below' as experiment_id, 'control' as arm from range(79) t(i)
          union all select 'below_b_' || i, 'below', 'variant_b' from range(86) t(i)
          union all select 'below_v_' || i, 'below', 'variant_c' from range(127) t(i)
          union all select 'above_c_' || i, 'above', 'control' from range(62) t(i)
          union all select 'above_b_' || i, 'above', 'variant_b' from range(93) t(i)
          union all select 'above_v_' || i, 'above', 'variant_c' from range(51) t(i)
    expect:
      rows:
        - {experiment_id: below, assigned_players: 292, is_srm_flagged: false}
        - {experiment_id: above, assigned_players: 206, is_srm_flagged: true}
