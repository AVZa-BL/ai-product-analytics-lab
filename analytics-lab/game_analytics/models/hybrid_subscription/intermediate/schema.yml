version: 2

models:
  - name: int_hybrid_subscription__subscription_entitlements
    description: One reconstructed entitlement interval per synthetic subscriber.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: subscription_id
        data_tests: [not_null, unique]
      - name: player_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_hybrid_subscription__players')
                field: player_id
      - name: entitlement_start_at_utc
        data_tests: [not_null]
      - name: entitlement_end_at_utc
        data_tests: [not_null]

  - name: int_hybrid_subscription__grant_reconciliation
    description: Subscription transaction to currency-grant reconciliation with missing links classified.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: grant_link_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [linked, missing_link, no_grant]

  - name: int_hybrid_subscription__marketing_exposure_eligibility
    description: Exposure timing eligibility for matching and incrementality analysis.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: exposure_id
        data_tests: [not_null, unique]
      - name: player_id
        data_tests: [not_null]

  - name: int_hybrid_subscription__analysis_population
    description: All candidate rows with valid-identity, matching-covariate, eligible-exposure and per-source event/ingestion maturity exclusions.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        description: May be null or blank only on an explicitly excluded candidate.
      - name: index_at_utc
        description: First eligible exposure timestamp; null when the player has no eligible exposure.
      - name: eligible_exposure_at_utc
        description: First incrementality-eligible marketing exposure timestamp.
      - name: observation_start_at_utc
        description: Latest of the per-source first event timestamps; sources must all cover the pre-window.
      - name: observation_end_at_utc
        description: Earliest of the per-source last event timestamps; sources must all cover the post-window.
      - name: ingestion_mature_through_at_utc
        description: Minimum across sources of max ingestion time minus maximum observed nonnegative lag; empirical allowance, not an operational completeness SLA.
      - name: are_source_watermarks_valid
        description: All three relevant sources are present and contain only finite non-null event/ingestion timestamps with nonnegative lag.
        data_tests: [not_null]
      - name: exclusion_reason
        description: Mutually exclusive reason the player is excluded from mature pre/post analysis.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - no_eligible_exposure
                  - subscription_not_after_exposure
                  - invalid_player_identity
                  - invalid_matching_covariates
                  - missing_or_invalid_source_watermark
                  - immature_pre_window
                  - immature_post_window
                  - ingestion_watermark_not_mature
      - name: is_population_eligible
        description: True only when exposure ordering and both 28-day observation windows are valid.
        data_tests: [not_null]

  - name: int_hybrid_subscription__player_28d_behavior
    description: Two mature pre/post behavior rows per eligible player with governed engagement, LiveOps, and separated cash categories.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: analysis_period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pre, post]
      - name: index_at_utc
        data_tests: [not_null]
      - name: eligible_exposure_at_utc
        data_tests: [not_null]
      - name: is_population_eligible
        data_tests: [not_null]
      - name: is_window_mature
        data_tests: [not_null]
      - name: reward_track_net_revenue_usd
        data_tests: [not_null]
      - name: standalone_transaction_count
        data_tests: [not_null]
      - name: discounted_standalone_transaction_count
        data_tests: [not_null]

  - name: int_hybrid_subscription__matched_pairs
    description: >-
      Deterministic greedy one-to-one matches without replacement, using mature eligible
      pre-period behavior and exact prior-payer, platform, and acquisition-channel strata.
      Subscribers are visited by stratum, pre-session count, then player ID. Each chooses
      the unused control with minimum absolute pre-session distance, then lower control
      pre-session count, then control player ID. No pair row is emitted for an unmatched
      subscriber; an entirely unmatched population therefore produces an empty relation.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: pair_id
        description: Subscriber player ID joined to control player ID with a double underscore.
        data_tests: [not_null, unique]
      - name: subscriber_sequence
        description: Global subscriber visit order; gaps identify unmatched subscribers.
        data_tests: [not_null, unique]
      - name: subscriber_player_id
        data_tests: [not_null, unique]
      - name: control_player_id
        data_tests: [not_null, unique]
      - name: subscriber_prior_payer_status
        data_tests: [not_null]
      - name: control_prior_payer_status
        data_tests: [not_null]
      - name: subscriber_platform
        data_tests: [not_null]
      - name: control_platform
        data_tests: [not_null]
      - name: subscriber_acquisition_channel
        data_tests: [not_null]
      - name: control_acquisition_channel
        data_tests: [not_null]
      - name: subscriber_pre_session_count
        data_tests: [not_null]
      - name: control_pre_session_count
        data_tests: [not_null]
      - name: pre_session_count_distance
        description: Absolute difference between subscriber and control pre-session counts.
        data_tests: [not_null]
      - name: eligible_subscriber_count
        description: All eligible pre-period subscribers, repeated on each pair.
        data_tests: [not_null]
      - name: eligible_control_count
        description: All eligible pre-period controls, repeated on each pair.
        data_tests: [not_null]
      - name: matched_pair_count
        description: Total matched pairs, repeated on each pair.
        data_tests: [not_null]
      - name: unmatched_subscriber_count
        description: Eligible subscribers minus matched pairs.
        data_tests: [not_null]
      - name: unmatched_control_count
        description: Eligible controls minus matched pairs.
        data_tests: [not_null]

  - name: int_hybrid_subscription__match_population_summary
    description: >-
      Exactly one row of eligible, matched, and unmatched population control totals,
      including empty, single-arm, and disjoint-stratum populations with zero pairs.
      Counts come from eligible pre-period behavior and actual matched pairs, so no
      synthetic pair row is needed. The population reconciliation test enforces the
      one-row grain and independently verifies all five totals.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: eligible_subscriber_count
        description: All mature eligible pre-period subscribers, including unmatched players.
        data_tests: [not_null]
      - name: eligible_control_count
        description: All mature eligible pre-period controls, including unmatched players.
        data_tests: [not_null]
      - name: matched_pair_count
        description: Actual pair row count; zero when no pairs exist.
        data_tests: [not_null]
      - name: unmatched_subscriber_count
        description: Eligible subscribers minus actual matched pairs.
        data_tests: [not_null]
      - name: unmatched_control_count
        description: Eligible controls minus actual matched pairs.
        data_tests: [not_null]

  - name: int_hybrid_subscription__quality_audit
    description: Counts of designed defects preserved through the governed intermediate layer.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: incident_code
        data_tests: [not_null, unique]
      - name: affected_rows
        data_tests: [not_null]

  - name: int_hybrid_subscription__source_watermarks
    description: Three fail-closed per-source completeness proxy rows. Uses only observed event and ingestion timestamps, never a wall-clock or invented telemetry watermark.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: source_name
        data_tests: [not_null, unique]
      - name: source_row_count
        data_tests: [not_null]
      - name: invalid_timestamp_row_count
        data_tests: [not_null]
      - name: post_window_allowance_seconds
        description: Maximum observed nonnegative ingestion lag in elapsed seconds, including latest canonical webhook arrival. Null when no valid observations exist.
      - name: is_source_valid
        data_tests: [not_null]

  - name: int_hybrid_subscription__governed_observation_boundary
    description: One fail-closed observation boundary shared by forward-looking hybrid analyses; as-of is the minimum mature-through timestamp across all three required sources.
    config:
      tags: [hybrid_subscription]
    columns:
      - name: are_source_watermarks_valid
        data_tests: [not_null]
      - name: observation_start_at_utc
      - name: observation_end_at_utc
      - name: as_of_at_utc
