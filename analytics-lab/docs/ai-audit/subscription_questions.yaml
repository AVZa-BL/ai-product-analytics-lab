  - id: subscription_reaggregation_rule
    category: difficult
    class: difficult
    question: Across the window, should trial-to-paid conversion be the mean of the daily rates or recomputed from totals?
    expected_metric: trial_to_paid_conversion
    expected_population: Recompute from summed numerators and denominators; a mean of daily rates weights sparse days equally with dense ones and is not the governed metric.
    expected_value: null
    expected_result: State the reaggregation rule rather than returning an averaged-rate number.
    tolerance: 0
    requires_refusal: false
    refusal_requirement: false
    approved_relations:
      - mart_subscription__kpis_daily
    latency: 1000
    cost: 0.02

